services:
  - type: web
    name: oracle-migration-cutover-readiness
    runtime: node
    region: singapore
    plan: starter
    # Single instance: the Kelsa data cache lives in memory.
    numInstances: 1
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: KELSA_ORIGIN
        value: https://kelsa.io
      - key: KELSA_USER_EMAIL
        sync: false
      - key: KELSA_USER_TOKEN
        sync: false
